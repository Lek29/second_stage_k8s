apiVersion: v1
kind: Pod
metadata:
  name: django-clearsessions
  labels:
    app: django-app
    component: maintenance
spec:
  containers:
  - name: django-clearsessions
    image: my-django-app:latest
    imagePullPolicy: IfNotPresent
    command: ["python", "manage.py", "clearsessions"]
    env:
    - name: SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: django-secrets
          key: SECRET_KEY
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: django-secrets
          key: DATABASE_URL
    - name: DEBUG
      value: "False"
    - name: ALLOWED_HOSTS
      value: "*"
  restartPolicy: Never
