version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: django-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mysite_db
      POSTGRES_USER: mysite_user
      POSTGRES_PASSWORD: mysite_password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
